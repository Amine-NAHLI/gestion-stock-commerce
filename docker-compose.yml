services:
  # Base de données MySQL
  db:
    image: mysql:8.0
    container_name: stockly-db
    restart: always
    environment:
      MYSQL_DATABASE: gestion_stock_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

  # Application Backend (Spring Boot)
  backend:
    build: ./backend
    container_name: stockly-api
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - DB_URL=jdbc:mysql://db:3306/gestion_stock_db?useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - ALLOWED_ORIGINS=http://localhost:8081,http://localhost:4200

  # Application Frontend (Angular)
  frontend:
    build: ./frontend
    container_name: stockly-ui
    restart: always
    depends_on:
      - backend
    ports:
      - "8081:80"