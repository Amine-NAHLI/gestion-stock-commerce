# ===========================================
# CONFIGURATION DU SERVEUR
# ===========================================
spring.application.name=backend
server.port=${PORT:7860}

# ===========================================
# CONFIGURATION BASE DE DONNEES (MySQL/MariaDB - Laragon)
# ===========================================
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/gestion_stock_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================
# CONFIGURATION JPA / HIBERNATE
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===========================================
# CONFIGURATION JACKSON (JSON)
# ===========================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ===========================================
# CONFIGURATION LOGS
# ===========================================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.gestionstock=DEBUG

# ===========================================
# CONFIGURATION JWT
# ===========================================
jwt.secret=${JWT_SECRET:GestionStockApplicationSecretKeyForJWTTokenSigningAndValidation2026}
jwt.expiration=86400000

# ===========================================
# CONFIGURATION CORS
# ===========================================
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,https://gestion-stock-commerce-lmkzywlko-amine-nahlis-projects.vercel.app,https://gestion-stock-commerce.vercel.app}

# ===========================================
# UPLOAD FICHIERS
# ===========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Désactive le redémarrage de Spring DevTools en mode développement
spring.devtools.restart.enabled=false


# ===========================================
# CONFIGURATION MAIL SMTP (Gmail)
# ===========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:admin@stockly.com}
spring.mail.password=${GMAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
spring.mail.from=${GMAIL_FROM_ADDRESS:noreply@stockly.com}
app.mail.enabled=${APP_MAIL_ENABLED:true}

# URL du backend utilisée pour construire le lien de vérification
app.backend.url=${APP_BACKEND_URL:https://aminenahli-stockly-backend.hf.space}

# Groq AI Configuration
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.1-8b-instant
